# SaveSync game profiles
#
# Each section describes one game available both on Switch and on Steam:
#
#   [Game name]
#   switch    = Switch title ID (hex, 16 digits)
#   steam     = Steam AppID
#   converter = hollow_knight            (optional, only when the formats differ)
#   status    = verified | unverified    (verified = tested for real in both directions)
#   map       = <Steam Cloud pattern> => <path inside the Switch save>
#   slot_offset = 1                      (optional, applies to the previous map line)
#   combine   = yes                      (optional: all map lines with the same slot
#                                         number form ONE save, always copied together)
#
# Patterns:
#   #    one or more digits (save slot number)
#   *    any name, without '/'
#   **   at the end only: everything inside a folder, synced as ONE save
# Wildcards must appear in the same order on both sides of "=>".
# Steam Cloud names start with a root such as %WinAppDataLocalLow% or
# %WinAppDataRoaming%: run tools/cloudconfig.py <appid> to get them for any game.
#
# Only list real save slots: never settings files, and never the backup copies
# the PC game makes by itself (they stay untouched in Steam Cloud).
#
# You can add or override profiles without rebuilding the app by creating
# sdmc:/switch/savesync/games.ini with the same format.

[Hollow Knight]
switch = 0100633007D48000
steam = 367520
converter = hollow_knight
status = verified
map = %WinAppDataLocalLow%Team Cherry/Hollow Knight/user#.dat => user#.dat

[Nine Sols]
switch = 0100D810170D0000
steam = 1809540
status = verified
map = %WinAppDataLocalLow%RedCandleGames/NineSols/saveslot#/flags.sav => saveslot#/flags.sav
slot_offset = 1

# Same files and format on both platforms. A slot is made of several files that must stay
# together (the profile, its version file and the in-run autosave): hence "combine".
[Hades II]
switch = 0100A00019DE0000
steam = 1145350
status = verified
combine = yes
map = %WinSavedGames%Hades II/Profile#.sav => Profile#.sav
map = %WinSavedGames%Hades II/Profile#.v.sav => Profile#.v.sav
map = %WinSavedGames%Hades II/Profile#_Temp.sav => Profile#_Temp.sav

